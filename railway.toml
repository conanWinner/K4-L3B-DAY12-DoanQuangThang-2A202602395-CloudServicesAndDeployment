# CP5 — Cấu hình mẫu cũ, giữ lại để tham khảo bài lab.
# Railway không áp dụng Config as Code qua railway.toml cho service mới.
# .railwayignore loại file này khỏi gói `railway up`; cấu hình service mới
# sẽ đặt trên Railway dashboard. Không đặt khóa API trong file này.
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard.
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
