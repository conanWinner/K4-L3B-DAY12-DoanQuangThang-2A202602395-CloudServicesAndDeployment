# ═══════════════════════════════════════════════════════════════════
# CP2/CP4 — Stack chạy ở máy bạn: nginx + agent + redis
#
# Service `redis` đã cho sẵn — chạy ngay từ Block 1 để có Redis mà code:
#     docker compose up -d redis
#
# NHIỆM VỤ: bổ sung service `agent`. Yêu cầu:
#   [ ] build từ Dockerfile trong thư mục hiện tại
#   [ ] mở cổng 8000 qua nginx để có thể scale nhiều bản sao agent
#   [ ] KHÔNG viết secret thẳng vào file này — dùng nội suy biến môi trường
#       `${AGENT_API_KEY}` (docker compose tự đọc từ file .env cùng thư mục)
#   [ ] REDIS_URL trỏ tới `redis://redis:6379/0` — trong compose, tên service
#       chính là hostname
#   [ ] depends_on: redis
#   [ ] healthcheck gọi /health
#
# CP4: nginx giữ cổng host 8000, còn agent chỉ nghe trong mạng Compose.
#     docker compose up -d --build --scale agent=3
#
# Kiểm tra: pytest tests/test_cp2.py -v
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    build: .
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY}
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent:
        condition: service_healthy

volumes:
  redis-data:
